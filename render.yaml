services:
  - type: web
    name: mid-diary-backend
    env: node
    plan: free
    buildCommand: cd backend-node && npm install
    startCommand: cd backend-node && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        scope: build,runtime
      - key: DB_USER
        scope: build,runtime
      - key: DB_PASSWORD
        scope: build,runtime
      - key: DB_NAME
        value: mid_diary
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: FIREBASE_SERVICE_ACCOUNT
        scope: build,runtime
      - key: CLOUDINARY_CLOUD_NAME
        scope: build,runtime
      - key: CLOUDINARY_API_KEY
        scope: build,runtime
      - key: CLOUDINARY_API_SECRET
        scope: build,runtime
      - key: CLOUDINARY_FOLDER
        value: mid-uploads
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: MID_BOOTSTRAP_ADMIN_USERNAME
        scope: build,runtime
      - key: XAI_API_KEY
        scope: build,runtime
      - key: XAI_MODEL
        value: grok-4.5
      - key: ALLOWED_ORIGINS
        scope: build,runtime
